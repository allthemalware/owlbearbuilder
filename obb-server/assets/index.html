<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlbearBuilder</title>
<style>
:root {
  color-scheme:dark;
  --bg:#15181d;
  --panel:#20252c;
  --line:#363e48;
  --text:#edf1f5;
  --muted:#a8b2bf;
  --accent:#f08c45;
  --green:#79c99e;
  --red:#ef7777}
* {
  box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header {
  padding:12px 12px 8px;
  border-bottom:1px solid var(--line)}
h1 {
  font-size:17px;
  margin:0 0 8px}
.settings {
  display:flex;
  gap:6px;
  align-items:center}
.settings input {
  min-width:0;
  flex:1}
input,select,textarea,button {
  font:inherit;
  color:inherit;
  background:#171b20;
  border:1px solid var(--line);
  border-radius:5px;
  padding:6px}
button {
  cursor:pointer;
  background:#2b333d}
button:hover {
  border-color:var(--accent)}
button:disabled {
  opacity:.45;
  cursor:not-allowed}
.primary {
  background:#70401f;
  border-color:#a9612e}
.danger {
  color:#ffc0b7}
.connection {
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  flex:none}
.connection.online {
  background:var(--green)}
#notice {
  font-size:11px;
  color:var(--muted);
  min-height:16px;
  margin-top:5px}
nav {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px 8px;
  gap:5px;
  border-bottom:1px solid var(--line)}
nav button {
  padding:7px 2px;
  font-size:12px}
nav button.active {
  border-color:var(--accent);
  color:#ffd2ae}
main {
  height:calc(100vh - 132px);
  overflow:auto;
  padding:9px}
.tab {
  display:none}
.tab.active {
  display:block}
.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:7px;
  padding:9px;
  margin-bottom:8px}
.row {
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap}
.between {
  justify-content:space-between}
.stack {
  display:grid;
  gap:6px}
.grid2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px}
.title {
  font-weight:700;
  font-size:14px}
.muted,.small {
  color:var(--muted);
  font-size:11px}
.small {
  line-height:1.35}
.section {
  font-weight:700;
  margin:2px 0 7px}
.metric {
  padding:4px 6px;
  background:#171b20;
  border-radius:5px;
  font-size:11px}
.bar {
  height:6px;
  background:#111;
  border-radius:5px;
  overflow:hidden;
  margin:5px 0}
.bar i {
  display:block;
  height:100%;
  background:var(--green)}
.pill {
  display:inline-block;
  background:#343c46;
  border-radius:12px;
  padding:2px 7px;
  margin:2px;
  font-size:10px}
.actions button {
  padding:4px 7px;
  font-size:11px}
textarea {
  width:100%;
  min-height:68px;
  resize:vertical}
input[type=file] {
  max-width:100%}
.roll {
  border-top:1px solid var(--line);
  padding:6px 0}
.badge {
  font-size:9px;
  font-weight:800;
  padding:2px 5px;
  border-radius:4px;
  background:#3d4148}
.badge.crit {
  background:#80521c}
.badge.fail {
  background:#663b42}
.danger-text {
  color:#ffb1a7}
.mono {
  font-family:ui-monospace,monospace}
svg {
  width:100%;
  height:190px;
  background:#151a1f;
  border:1px solid var(--line);
  border-radius:5px}
.scroll {
  max-height:180px;
  overflow:auto}

</style>
<script src="obr_bridge.js"></script>
</head>
<body>
<header>
<div class="row between">
<h1>OwlbearBuilder</h1>
<span id="connection" class="connection" title="Connection status">
</span>
</div>
<div class="settings">
<input id="api-address" aria-label="API address">
<button id="save-address">Connect</button>
</div>
<div id="notice" role="status">Start <code>owlbearbuilder serve</code> on the GM's computer.</div>
</header>
<nav aria-label="GM views">
<button id="tab-party" data-tab="party">Party &amp; Sheets</button>
<button id="tab-combat" data-tab="combat">Initiative</button>
<button id="tab-monsters" data-tab="monsters">Monsters</button>
<button id="tab-spells" data-tab="spells">Spells &amp; Areas</button>
</nav>
<main>
<section id="view-party" class="tab">
</section>
<section id="view-combat" class="tab">
</section>
<section id="view-monsters" class="tab">
</section>
<section id="view-spells" class="tab">
</section>
</main><script>
'use strict';
(() => {
  const $ = s => document.querySelector(s),
        esc = x => String(x ?? '').replace(
            /[&<>"']/g,
            c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;'}[c]));
  let room = {
    characters: [],
    monsters: [],
    bestiary: [],
    roll_log: [],
    encounter: {combatants: []},
    aoe_templates: []
  },
      selected = '', connected = false, inOwlbear = false, role = 'GM', playerSnapshot = null,
      snapshotTimer = 0, knownRolls = new Set(), boundItems = new Map(), boundActors = new Map(),
      lastAoe = null, lastAoeSource = null;
  const ROOM_KEY = 'com.owlbearbuilder/room', ACTOR_KEY = 'com.owlbearbuilder/actor',
        ROLL_CHANNEL = 'com.owlbearbuilder/rolls';
  const notice = (s, bad = false) => {
    $('#notice').textContent = s;
    $('#notice').classList.toggle('danger-text', bad);
  };
  const api = async (path, body) => {
    try {
      let result = await ObrBridge.api(path, body);
      notice('Connected to ' + ObrBridge.apiBase());
      $('#connection').classList.add('online');
      connected = true;
      return result
    } catch (e) {
      notice('Start owlbearbuilder serve on the GM\'s computer. ' + e.message, true);
      $('#connection').classList.remove('online');
      connected = false;
      throw e
    }
  };
  const act = (path, body) => api(path, body).catch(() => {}), chars = () => room.characters || [],
        monsters = () => room.monsters || [], entry = id => chars().find(x => x.sheet.id === id),
        sheet = () => entry(selected)?.sheet;
  function setTab(name) {
    if (!['party', 'combat', 'monsters', 'spells'].includes(name)) name = 'party';
    location.hash = name;
    document.querySelectorAll('.tab').forEach(
        x => x.classList.toggle('active', x.id === 'view-' + name));
    document.querySelectorAll('nav button')
        .forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  }
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));
  const conditions = (list = []) => list.length ?
      list.map(c => `<span class="pill">${esc(c.label || c.name || c)}</span>`).join('') :
      '<span class="muted">No conditions</span>';
  const mod = (o, ...keys) => {
    for (const k of keys)
      if (o && o[k] != null) return o[k];
    return '—'
  };
  function renderParty() {
    let c = sheet(),
        rows =
            chars()
                .map(x => {
                  let s = x.sheet, r = x.row || {};
                  return `<article class="card">
<div class="row between">
<button class="title select-char" data-id="${
                      esc(s.id)}">${esc(s.name)}</button>
<span>${
                      esc(r.current_hp ?? s.current_hp)} / ${
                      esc(r.max_hp ?? s.max_hp)} HP</span>
</div>
<div class="bar">
<i style="width:${
                      Math.max(
                          0,
                          Math.min(
                              100,
                              100 * (Number(r.current_hp ?? s.current_hp) || 0) /
                                  (Number(r.max_hp ?? s.max_hp) ||
                                   1)))}%">
</i>
</div>
<div class="row">
<span class="metric">AC ${
                      esc(r.ac ?? s.ac)}</span>
<span class="metric">Fort ${
                      esc(r.fortitude ?? '—')}</span>
<span class="metric">Ref ${
                      esc(r.reflex ?? '—')}</span>
<span class="metric">Will ${
                      esc(r.will ?? '—')}</span>
<span class="metric">Perception DC ${
                      esc(r.perception_dc ?? '—')}</span>
<span class="metric">Stealth DC ${
                      esc(r.stealth_dc ??
                          '—')}</span>
</div>
<div>${conditions(s.conditions)}</div>
</article>`
                })
                .join('');
    const skills = c?.skills || [];
    const strikes = c?.strikes || [];
    $('#view-party').innerHTML = `<div class="card">
<div class="section">Party</div>${
        rows ||
        '<div class="muted">Import a character to get started.</div>'}<button data-bind-token="${
        esc(c?.id ||
            '')}">Bind to selected token</button>
<div class="section">Import Pathbuilder JSON</div>
<textarea id="import-json" placeholder="Paste character export JSON">
</textarea>
<div class="row">
<button id="import-button" class="primary">Import / merge</button>
<input id="import-file" type="file" accept="application/json,.json">
</div>
<div id="import-result" class="small">
</div>
</div>${
        c ? `<div class="card">
<div class="row between">
<div class="title">${esc(c.name)} · Level ${
                esc(c.level)}</div>
<button class="danger remove-char" data-id="${
                esc(c.id)}">Remove</button>
</div>
<div class="row">
<button data-roll="perception">Initiative: Perception</button>
<button data-skill="Stealth">Stealth</button>
<button data-skill="Deception">Deception</button>
</div>
<div class="section">Strikes</div>${
                strikes
                    .map(
                        (s, i) => `<div class="row between">
<span>${
                            esc(s.name || s.label ||
                                `Strike ${
                                    i + 1}`)}</span>
<span class="actions">
<button data-strike="${
                            i}" data-map="0">1st</button>
<button data-strike="${
                            i}" data-map="1">2nd</button>
<button data-strike="${
                            i}" data-map="2">3rd</button>
<button data-damage="${
                            i}">Damage</button>
<button data-damage="${
                            i}" data-critical="true">Crit</button>
</span>
</div>`)
                    .join('') ||
                '<div class="muted">No strikes listed.</div>'}<div class="section">Saves &amp; skills</div>
<div class="row">${
                    ['Fortitude', 'Reflex', 'Will']
                        .map(n => `<button data-save="${n}">${n}</button>`)
                        .join('')}${
                skills
                    .map(
                        s =>
                            `<button data-skill="${esc(s.name || s)}">${esc(s.name || s)}</button>${
                                s.name ? `<button data-assurance="${esc(s.name)}">Assure</button>` :
                                         ''}`)
                    .join('')}</div>
<div class="section">Conditions</div>
<div class="row">${
                    ['Frightened', 'Sickened', 'Clumsy', 'Enfeebled', 'Stupefied', 'Drained']
                        .map(
                            n => `<span>${n} <button data-condition="${
                                n}" data-value="-1">−</button>
<button data-condition="${
                                n}" data-value="1">+</button>
</span>`)
                        .join(
                            '')}<button data-condition="Off-Guard" data-value="1">Off-Guard</button>
<button data-raise="true">Raise Shield</button>
</div>
<div class="section">Health &amp; hero points</div>
<div class="row">
<button data-hp="-1">HP −</button>
<button data-hp="1">HP +</button>
<span>Hero points ${
                esc(c.hero_points ??
                    0)}</span>
<button data-hero="-1">−</button>
<button data-hero="1">+</button>
</div>
</div>` :
            ''}`;
    $('#view-party').querySelectorAll('.select-char').forEach(b => b.onclick = () => {
      selected = b.dataset.id;
      render()
    });
    $('#view-party')
        .querySelector('[data-bind-token]')
        ?.addEventListener('click', () => bindToken(selected));
    $('#import-button').onclick = async () => {
      try {
        const value = JSON.parse($('#import-json').value);
        const res = await api('/api/import/character', value);
        $('#import-result').textContent = (res.merged ? 'Merged: ' : 'Imported: ') + res.id +
            ((res.changes || []).length ? ' · ' + res.changes.join(', ') : ' · no field changes')
      } catch (e) {
        $('#import-result').textContent = e.message
      }
    };
    $('#import-file').onchange = async e => {
      if (e.target.files[0]) $('#import-json').value = await e.target.files[0].text()
    };
    $('#view-party')
        .querySelectorAll(
            '[data-roll],[data-save],[data-skill],[data-assurance],[data-strike],[data-damage]')
        .forEach(b => b.onclick = () => {
          let body = {actor: selected};
          if (b.dataset.roll)
            body.kind = b.dataset.roll;
          else if (b.dataset.save) {
            body.kind = 'save';
            body.name = b.dataset.save
          } else if (b.dataset.skill) {
            body.kind = 'skill';
            body.name = b.dataset.skill
          } else if (b.dataset.assurance) {
            body.kind = 'assurance';
            body.name = b.dataset.assurance
          } else if (b.dataset.strike != null) {
            Object.assign(
                body,
                {kind: 'strike', index: +b.dataset.strike, map: +b.dataset.map, dc: room.target_dc})
          } else
            Object.assign(body, {
              kind: 'damage',
              index: +b.dataset.damage,
              critical: b.dataset.critical === 'true'
            });
          act('/api/roll', body)
        });
    $('#view-party').querySelectorAll('[data-condition]').forEach(b => b.onclick = () => {
      const name = b.dataset.condition;
      let value = (sheet()?.conditions || []).find(x => (x.label || x.name) === name)?.value || 0;
      act('/api/character/update', {
        id: selected,
        condition: {name, value: name === 'Off-Guard' ? 1 : Math.max(0, value + (+b.dataset.value))}
      })
    });
    $('#view-party')
        .querySelectorAll('[data-hp]')
        .forEach(b => b.onclick = () => act('/api/character/update', {
                   id: selected,
                   heal: b.dataset.hp === '1' ? 1 : undefined,
                   damage: b.dataset.hp === '-1' ? 1 : undefined
                 }));
    $('#view-party')
        .querySelectorAll('[data-hero]')
        .forEach(
            b => b.onclick = () => act('/api/character/update', {
              id: selected,
              hero_points: Math.max(0, Math.min(3, (sheet()?.hero_points || 0) + (+b.dataset.hero)))
            }));
    $('#view-party [data-raise]')
        ?.addEventListener(
            'click', () => act('/api/character/update', {id: selected, raise_shield: true}));
    $('#view-party .remove-char')?.addEventListener('click', () => act('/api/character/remove', {
                                                               id: selected
                                                             }));
  }
  function renderMonsters() {
    const built = room.bestiary || [];
    $('#view-monsters')
        .innerHTML = `<div class="card">
<div class="section">Add monsters</div>
<label class="small">Built-in bestiary</label>
<select id="builtin-monster">
<option value="">Choose creature</option>${
        built
            .map(
                m => `<option value="${esc(m.id)}">${esc(m.name)} · level ${esc(m.level)}</option>`)
            .join(
                '')}</select>
<div class="row">
<select id="monster-variant">
<option>normal</option>
<option>elite</option>
<option>weak</option>
</select>
<input id="monster-count" type="number" min="1" max="20" value="1" aria-label="Count">
<button id="add-monster" class="primary">Add</button>
</div>
<div class="section">Or paste a stat block</div>
<textarea id="monster-text" placeholder="Paste stat block text">
</textarea>
<div class="row">
<input id="monster-file" type="file" accept="text/plain,.txt">
<button id="parse-monster">Import text</button>
</div>
</div>${
        monsters()
            .map(m => {
              let x = m.instance, s = m.stats || {};
              return `<div class="card">
<div class="row between">
<b>${
                  esc(x.label || x.name)} <span class="pill">${
                  esc(x.variant || 'normal')}</span>
</b>
<span>
<button data-bind-token="${
                  esc(x.instance_id)}">Bind to selected token</button>
<button class="danger" data-monster-remove="${
                  esc(x.instance_id)}">Remove</button>
</span>
</div>
<div class="row">
<span class="metric">AC ${
                  esc(s.ac)}</span>
<span class="metric">Fort ${
                  esc(s.saves?.fortitude ?? s.fortitude)}</span>
<span class="metric">Ref ${
                  esc(s.saves?.reflex ?? s.reflex)}</span>
<span class="metric">Will ${
                  esc(s.saves?.will ??
                      s.will)}</span>
<span class="metric">HP ${esc(x.current_hp)} / ${
                  esc(x.max_hp)}</span>
</div>
<div class="row actions">
<button data-monster-variant="${
                  esc(x.instance_id)}" data-value="normal">Normal</button>
<button data-monster-variant="${
                  esc(x.instance_id)}" data-value="elite">Elite</button>
<button data-monster-variant="${
                  esc(x.instance_id)}" data-value="weak">Weak</button>
<button data-monster-damage="${
                  esc(x.instance_id)}">HP −</button>
<button data-monster-heal="${
                  esc(x.instance_id)}">HP +</button>
</div>
<div class="section">Strikes</div>${
                  (s.strikes || [])
                      .map(
                          (a, i) => `<div class="row between">
<span>${
                              esc(a.name ||
                                  `Strike ${i + 1}`)} · ${esc(a.damage || '')}</span>
<span>${
                                  [0, 1, 2]
                                      .map(
                                          n => `<button data-monster-roll="${
                                              esc(x.instance_id)}" data-index="${i}" data-map="${
                                              n}">${['1st', '2nd', '3rd'][n]}</button>`)
                                      .join('')}<button data-monster-damage-roll="${
                              esc(x.instance_id)}" data-index="${i}">Damage</button>
</span>
</div>`)
                      .join('')}<div class="row">${
                      ['Fortitude', 'Reflex', 'Will']
                          .map(
                              n => `<button data-monster-save="${esc(x.instance_id)}" data-name="${
                                  n}">${n}</button>`)
                          .join('')}</div>
<div class="row">${
                      ['Frightened', 'Sickened', 'Clumsy', 'Enfeebled', 'Stupefied', 'Drained',
                       'Off-Guard']
                          .map(
                              n => `<button data-monster-condition="${
                                  esc(x.instance_id)}" data-name="${n}">${n} +</button>`)
                          .join('')}</div>${conditions(x.conditions)}</div>`
            })
            .join('') ||
        '<div class="card muted">No monsters in the room.</div>'}`;
    $('#add-monster').onclick = () => {
      const id = $('#builtin-monster').value;
      if (id)
        act('/api/monster/import',
            {builtin: id, variant: $('#monster-variant').value, count: +$('#monster-count').value})
    };
    $('#parse-monster').onclick = () => {
      const text = $('#monster-text').value;
      if (text)
        act('/api/monster/import',
            {text, variant: $('#monster-variant').value, count: +$('#monster-count').value})
    };
    $('#monster-file').onchange = async e => {
      if (e.target.files[0]) $('#monster-text').value = await e.target.files[0].text()
    };
    $('#view-monsters')
        .querySelectorAll('[data-bind-token]')
        .forEach(b => b.onclick = () => bindToken(b.dataset.bindToken));
    $('#view-monsters')
        .querySelectorAll('[data-monster-remove]')
        .forEach(b => b.onclick = () => act('/api/monster/remove', {id: b.dataset.monsterRemove}));
    $('#view-monsters')
        .querySelectorAll('[data-monster-variant]')
        .forEach(
            b => b.onclick = () => act(
                '/api/monster/update', {id: b.dataset.monsterVariant, variant: b.dataset.value}));
    $('#view-monsters')
        .querySelectorAll('[data-monster-damage],[data-monster-heal]')
        .forEach(b => b.onclick = () => act('/api/monster/update', {
                   id: b.dataset.monsterDamage || b.dataset.monsterHeal,
                   [b.dataset.monsterDamage ? 'damage' : 'heal']: 1
                 }));
    $('#view-monsters')
        .querySelectorAll('[data-monster-roll],[data-monster-damage-roll],[data-monster-save]')
        .forEach(b => b.onclick = () => {
          const body = {
            actor: b.dataset.monsterRoll || b.dataset.monsterDamageRoll || b.dataset.monsterSave
          };
          if (b.dataset.monsterRoll)
            Object.assign(
                body,
                {kind: 'strike', index: +b.dataset.index, map: +b.dataset.map, dc: room.target_dc});
          else if (b.dataset.monsterDamageRoll)
            Object.assign(body, {kind: 'damage', index: +b.dataset.index});
          else
            Object.assign(body, {kind: 'save', name: b.dataset.name});
          act('/api/roll', body)
        });
    $('#view-monsters')
        .querySelectorAll('[data-monster-condition]')
        .forEach(
            b => b.onclick = () =>
                act('/api/monster/update',
                    {id: b.dataset.monsterCondition, condition: {name: b.dataset.name, value: 1}}));
  }
  function renderSpells() {
    const c = entry(selected), spells = c?.spellbook || [];
    $('#view-spells').innerHTML =
        `<div class="card">
<div class="section">Character spellbook</div>
<select id="spell-character">${
            chars()
                .map(
                    x => `<option value="${esc(x.sheet.id)}" ${
                        x.sheet.id === selected ? 'selected' : ''}>${esc(x.sheet.name)}</option>`)
                .join('')}</select>${
            spells
                .map(
                    s => `<div class="row between roll">
<span>
<b>${esc(s.name)}</b> · rank ${
                        esc(s.listed_rank)}<div class="small">${
                        esc(s.details?.description || s.details?.damage || '')}</div>
</span>${
                        s.details?.area ? `<span class="pill">${
                                              esc(s.details.area.label || s.details.area)}</span>` :
                                          ''}<button data-spell="${esc(s.name)}" data-rank="${
                        esc(s.listed_rank)}">Preview</button>
</div>`)
                .join('') ||
            '<p class="muted">Select a character with spells in its sheet.</p>'}</div>
<div class="card">
<div class="section">Quick area</div>
<div class="grid2">
<select id="area-shape">
<option value="burst">Burst</option>
<option value="emanation">Emanation</option>
<option value="cone">Cone</option>
<option value="line">Line</option>
</select>

  async function compute(source) {

        origin = {x: (scene.width || 0) / 2, y: (scene.height || 0) / 2}
      }
      origin = origin || {x: 0, y: 0};
      const dpi = await ObrBridge.getGridDpi().catch(() => 150),
            res = await api('/api/aoe/compute', {
              ...source,
              origin,

              direction_deg: +($('#area-direction')?.value || 0),

          esc(res.spell?.damage || '')}</div>${svgPreview(res, color)}`

  function svgPreview(d, color) {
    const cells = d.squares || d.cells || [], xs = cells.map(p => Number(p.x ?? p[0]) || 0),
          ys = cells.map(p => Number(p.y ?? p[1]) || 0);
    let minX = Math.min(0, ...xs), maxX = Math.max(4, ...xs), minY = Math.min(0, ...ys),
        maxY = Math.max(4, ...ys), w = maxX - minX + 1, h = maxY - minY + 1,
        cell = Math.min(26, 170 / Math.max(w, h)), parts = [];
    for (let y = minY; y <= maxY; y++)
      for (let x = minX; x <= maxX; x++) {
        let has =
            cells.some(p => (Number(p.x ?? p[0]) || 0) === x && (Number(p.y ?? p[1]) || 0) === y);
        parts.push(`<rect x="${(x - minX) * cell}" y="${(y - minY) * cell}" width="${
            cell}" height="${cell}" fill="${has ? esc(color) : '#20252c'}" fill-opacity="${
            has ? .4 : 1}" stroke="#59616d"/>`)
      }
    const outline = d.points || d.descriptor?.points || [];
    if (outline.length)
      parts.push(`<polygon points="${
          outline.map(p => `${((p.x - minX) * cell)},${((p.y - minY) * cell)}`)
              .join(' ')}" fill="none" stroke="${esc(color)}" stroke-width="2"/>`);
    return `<svg viewBox="0 0 ${w * cell} ${h * cell}" role="img" aria-label="Area grid preview">${
        parts.join('')}</svg>`
  }

  function actionList(character) {
    const s = character.sheet, id = s.id,
          out = [{label: 'Perception', kind: 'Perception', body: {actor: id, kind: 'perception'}}];
    ['Fortitude', 'Reflex', 'Will'].forEach(
        name =>
            out.push({label: name + ' save', kind: 'save', body: {actor: id, kind: 'save', name}}));
    (s.skills || []).forEach(skill => {
      const name = skill.name || skill;
      out.push({label: name, kind: 'skill', body: {actor: id, kind: 'skill', name}})
    });
    (s.strikes || []).forEach((strike, index) => {
      [0, 1, 2].forEach(map => out.push({
        label: (strike.name || strike.label || 'Strike') + ' · ' + ['1st', '2nd', '3rd'][map],
        kind: 'strike',
        body: {actor: id, kind: 'strike', index, map}
      }));
      out.push({
        label: (strike.name || strike.label || 'Strike') + ' · Damage',
        kind: 'damage',
        body: {actor: id, kind: 'damage', index}
      });
      out.push({
        label: (strike.name || strike.label || 'Strike') + ' · Critical damage',
        kind: 'damage',
        body: {actor: id, kind: 'damage', index, critical: true}
      })
    });
    return out
  }
  function snapshotSize(value) {
    return new Blob([JSON.stringify(value)]).size
  }
  function buildSnapshot() {
    const snap = {
      revision: room.revision || 0,
      party: chars().map(c => ({
                           id: c.sheet.id,
                           name: c.sheet.name,
                           row: c.row || {},
                           conditions: c.sheet.conditions || []
                         })),
      initiative: {
        round: room.encounter?.round || 0,
        active: room.encounter?.active &&
                room.encounter?.combatants?.[room.encounter?.active_index]?.combatant_id ||
            null,
        order: (room.encounter?.combatants || []).map(x => ({
          id: x.combatant_id,
          actor_id: x.actor_id,
          name: x.name,
          initiative: x.initiative
        }))
      },
      rolls: (room.roll_log || []).filter(x => !x.secret).slice(-10),
      actions: chars().map(c => ({id: c.sheet.id, name: c.sheet.name, actions: actionList(c)}))
    };
    while (snapshotSize(snap) > 15000 && snap.rolls.length) snap.rolls.shift();
    while (snapshotSize(snap) > 15000) {
      let a = snap.actions.find(x => x.actions.some(y => y.kind === 'skill'));
      if (!a) break;
      a.actions.splice(a.actions.findIndex(y => y.kind === 'skill'), 1)
    }
    return snap
  }
  async function publishSnapshot() {
    if (role !== 'GM' || !inOwlbear) return;
    try {
      const metadata = await ObrBridge.getRoomMetadata();
      await ObrBridge.setRoomMetadata({...metadata, [ROOM_KEY]: buildSnapshot()})
    } catch (e) {
      notice('Room snapshot: ' + e.message, true)
    }
  }
  function scheduleSnapshot() {
    clearTimeout(snapshotTimer);
    snapshotTimer = setTimeout(publishSnapshot, 300)
  }
  function announceRoll(r) {

          .notify(
              (r.actor_name || 'Roll') + ' · ' + r.label + ' · ' + r.total +
                  (r.degree ? ' · ' + String(r.degree).replaceAll('_', ' ') : ''),
              'INFO')
          .catch(e => notice(e.message, true))
    }
  }

  async function selectedItems() {
    const selection = await ObrBridge.getSelection(),
          items = selection?.items || selection?.ids || selection?.selectedIds || [];
    return Promise.all(items.map(async item => {
      if (typeof item !== 'string') return item;
      return (await ObrBridge.getItems([item]))[0]
    }))
  }
  async function bindToken(actorId) {
    try {
      const items = await selectedItems();
      if (items.length !== 1 || !items[0]?.id) throw new Error('Select exactly one token first');
      const id = items[0].id, token = await api('/api/token', {actor: actorId});
      await ObrBridge.setItemMetadata([id], ACTOR_KEY, token);
      boundActors.set(actorId, id);
      const isMonster = monsters().some(m => m.instance.instance_id === actorId);
      await api(
          isMonster ? '/api/monster/update' : '/api/character/update',
          {id: actorId, linked_token_id: id});
      boundItems.set(id, JSON.stringify(token));
      notice('Token bound')
    } catch (e) {
      notice(e.message, true)
    }
  }
  function serveRelay() {
    ObrBridge.relay.serve(async (action, payload) => {
      let result;
      if (action === 'import_character')
        result = await api('/api/import/character', payload);
      else if (action === 'roll')
        result = await api('/api/roll', {...payload, secret: false});
      else if (action === 'character_update') {
        const allowed =
                  [
                    'damage', 'heal', 'temp_hp', 'hero_points', 'condition', 'remove_condition',
                    'raise_shield'
                  ],
              body = {id: payload.id};
        allowed.forEach(k => {
          if (payload[k] !== undefined) body[k] = payload[k]
        });
        result = await api('/api/character/update', body)
      } else if (action === 'initiative_roll') {
        const id = payload.actor || payload.id, order = room.encounter?.combatants || [],
              present = order.some(x => x.actor_id === id);
        result = await api(
            '/api/initiative',
            present ? {action: 'roll', combatant: order.find(x => x.actor_id === id).combatant_id} :
                      {action: 'add', actor: id, roll: true})
      }
      if (action === 'roll') announceRoll(result);
      return result
    })
  }

  async function syncBoundTokens() {
    try {
      const items = await ObrBridge.getItems([]), actors = [
        ...chars().map(c => ({id: c.sheet.id, token: c.token})),
        ...monsters().map(m => ({id: m.instance.instance_id, token: m.token}))
      ];
      for (const item of items) {
        const payload = item.metadata?.[ACTOR_KEY], actor = actors.find(c => c.id === payload?.id);
        if (!actor || !actor.token) continue;
        const value = JSON.stringify(actor.token);
        if (JSON.stringify(payload) === value) {

        }
        if (boundItems.get(item.id) === value) continue;
        await ObrBridge.setItemMetadata([item.id], ACTOR_KEY, actor.token);
        boundItems.set(item.id, value)
      }
    } catch (e) {
      notice('Token update: ' + e.message, true)
    }
  }
  start().catch(e => notice(e.message, true));
